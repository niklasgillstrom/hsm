server:
  port: 8080
  # Headers only; the JSON body is bounded by swish.limits below.
  max-http-request-header-size: 8KB
  tomcat:
    # hsm accepts no form-encoded bodies.
    max-http-form-post-size: 64KB
    # How much of a rejected body Tomcat reads and discards before closing.
    max-swallow-size: 1MB

spring:
  application:
    name: hsm

swish:
  limits:
    # Maximum request body, enforced by RequestSizeLimitFilter.
    max-http-request-size: ${SWISH_MAX_REQUEST_SIZE:1MB}
  # Gatekeeper client configuration. The supervisory architecture in
  # Gillstrom (in preparation, CMLJ and CLSR) requires that the financial
  # entity's own verifier is independently witnessed by a gatekeeper
  # operated by (or on behalf of) the National Competent Authority,
  # which signs verification receipts and confirms issuance — closing
  # the loop on DORA Regulation (EU) 2022/2554 Article 6(10).
  #
  # The protocol is two-step: verify (returns a signed receipt) followed
  # by confirm (after issuance, gatekeeper checks the issued cert's
  # public key matches the one it approved).
  gatekeeper:
    # fail-closed (default) — refuses every gatekeeper call; SIGNING requests fail.
    # mock          — in-process mock that signs receipts with an ephemeral key.
    #                 NOT for production. Auto-registers its certificate with the
    #                 GatekeeperKeyRegistry so receipts validate locally.
    # http          — POST canonical request bodies to the configured URL and
    #                 parse JSON responses. Production wiring.
    mode: ${SWISH_GATEKEEPER_MODE:fail-closed}
    # Base URL of the gatekeeper. The client appends /v1/attestation/{countryCode}/verify
    # and /v1/attestation/{countryCode}/confirm.
    url: ${SWISH_GATEKEEPER_URL:}
    # ISO 3166-1 alpha-2 jurisdiction this entity operates in. Used in the
    # gatekeeper URL path. Default: SE (Sweden).
    country-code: ${SWISH_GATEKEEPER_COUNTRY_CODE:SE}
    timeout-ms: ${SWISH_GATEKEEPER_TIMEOUT_MS:5000}
    # Newline- or comma-separated list of PEM-encoded X.509 certificates whose subject
    # public keys are accepted as authoritative gatekeeper signing certificates.
    # If unset, no receipts will validate. Set in production to the operating
    # NCA's gatekeeper certificate(s).
    trusted-keys: ${SWISH_GATEKEEPER_TRUSTED_KEYS:}

  bankid:
    # Organisation numbers of the BankID relying parties (technical suppliers)
    # whose BankID orders may authorise a request. Comma-separated; hyphens are
    # ignored. Empty refuses every request (fail-closed).
    allowed-relying-parties: ${SWISH_BANKID_ALLOWED_RELYING_PARTIES:}

  # Keys and CSR signature algorithms a certificate request may use. Exact
  # allow-lists; anything not named is refused with KEY_POLICY_VIOLATION.
  # Keys: RSA-<bits> or EC-<curve> (SEC curve names, e.g. EC-secp384r1).
  key-policy:
    allowed-keys: ${SWISH_KEY_POLICY_ALLOWED_KEYS:RSA-4096}
    allowed-csr-signature-algorithms: ${SWISH_KEY_POLICY_ALLOWED_CSR_SIGNATURE_ALGORITHMS:SHA256withRSA,SHA384withRSA,SHA512withRSA}
    # When true, a SIGNING request's HSM attestation must itself state that the
    # HSM operates in FIPS-approved mode. The only such statement the verifiers
    # read is Yubico's (extension 1.3.6.1.4.1.41482.4.12); without it, or with
    # it false, the request is refused with FIPS_APPROVED_MODE_NOT_ATTESTED.
    # Every other vendor is refused with FIPS_MODE_NOT_IN_ATTESTATION_FORMAT.
    require-fips-approved-mode: ${SWISH_KEY_POLICY_REQUIRE_FIPS_APPROVED_MODE:false}

  # Trust anchors the attestation verifiers start from. Each is pinned in the
  # verifier source, where its comment block names the manufacturer's source.
  # Naming a PEM file here replaces the pinned anchor with the operator's own
  # copy, downloaded from the manufacturer; empty keeps the pinned anchor.
  # A named file that is missing, does not parse, holds a key of another type
  # or curve than the pinned anchor, or (for certificates) is not self-signed
  # stops start-up; so does an unknown key. Start-up logs each file's SHA-256
  # (of the DER certificate; for entrust, of the DER SubjectPublicKeyInfo) and
  # a WARN naming both values when it is not the pinned anchor.
  trust-anchors:
    yubico: ${SWISH_TRUST_ANCHOR_YUBICO:}
    securosys: ${SWISH_TRUST_ANCHOR_SECUROSYS:}
    # One or more certificates; they replace both pinned Marvell roots, for
    # the AZURE, GOOGLE and MARVELL verifiers.
    marvell: ${SWISH_TRUST_ANCHOR_MARVELL:}
    # Google's owner root (pinned: Hawksbill Root v1 prod), GOOGLE only.
    google-owner: ${SWISH_TRUST_ANCHOR_GOOGLE_OWNER:}
    thales: ${SWISH_TRUST_ANCHOR_THALES:}
    crypto4a: ${SWISH_TRUST_ANCHOR_CRYPTO4A:}
    fortanix: ${SWISH_TRUST_ANCHOR_FORTANIX:}
    # A PEM PUBLIC KEY (SubjectPublicKeyInfo) on NIST P-521, not a certificate.
    entrust: ${SWISH_TRUST_ANCHOR_ENTRUST:}

  issuance:
    # mock — issues a leaf certificate signed by an ephemeral in-process test
    #        CA. NOT for production; the only mode shipped in this reference repo.
    # In production, wire up an external Getswish CA integration via a custom
    # IssuanceClient implementation.
    mode: ${SWISH_ISSUANCE_MODE:mock}

# OpenAPI document and Swagger UI are off in every non-dev profile. Neither has
# a run-time function in this service, and the UI is a third-party JavaScript
# application (swagger-ui, DOMPurify) whose vulnerabilities would otherwise be
# part of the deployed surface. Enable locally with --spring.profiles.active=dev
# (application-dev.yaml).
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    # INFO by default; DEBUG is the operator's choice (THREAT_MODEL.md).
    eu.gillstrom.hsm: INFO
