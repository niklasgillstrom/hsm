## Developer profile — activate with: --spring.profiles.active=dev
##
## This profile turns the OpenAPI document and Swagger UI back on and trusts
## the Test BankID root (swish.bankid.allow-test-root). Every other profile
## leaves both off (see application.yaml).
## Do not deploy with this profile active.

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

swish:
  bankid:
    allow-test-root: true
